# Description: Experiment Configuration
---
version: 1
id: "spark4.1.4_delta_mor_sf_${EXP_SCALE_FACTOR}"
repetitions: 1
# Metadata accepts any key-value that we want to register together with the experiment run.
metadata:
  system: spark
  system_version: 4.1.4
  table_format: delta
  table_format_version: 4.3.1
  scale_factor: "${EXP_SCALE_FACTOR}"
  mode: mor

# The following parameter values will be used to replace the variables in the workload statements.
parameter_values:
  external_catalog: spark_catalog
  external_database: "external_tpcds"
  external_table_format: csv
  external_data_path: 's3a://lake-data/tpcds/sf${EXP_SCALE_FACTOR}/raw/'
  external_options_suffix: ',header="false",delimiter="|"'
  external_tblproperties_suffix: ''
  catalog: unity
  database: "spark_delta_mor_sf_${EXP_SCALE_FACTOR}"
  table_format: delta
  data_path: 's3a://lake-data/spark_delta_mor/sf_${EXP_SCALE_FACTOR}/'
  options_suffix: ''
  tblproperties_suffix: ', "delta.enableDeletionVectors"="true"'

